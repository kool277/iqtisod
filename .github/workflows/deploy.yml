# Publishes dist/ to the gh-pages branch; Settings -> Pages -> Source must stay
# "Deploy from a branch: gh-pages". rates/ is copied in from the fx-data branch
# (written by fx-rates.yml) because keep_files: false replaces the whole branch.
# Optional alternative: actions/upload-pages-artifact + actions/deploy-pages.
# Only switch after changing Settings -> Pages -> Source to "GitHub Actions";
# otherwise the live site stops updating.
name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  checks:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  deploy:
    name: Publish to gh-pages
    needs: checks
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    environment:
      name: production
      url: https://kool277.github.io/iqtisod/
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Check out published exchange rates
        id: rates
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fx-data
          path: fx-data
          sparse-checkout: rates
          persist-credentials: false

      - name: Include exchange rates in the site
        shell: bash
        env:
          RATES_OUTCOME: ${{ steps.rates.outcome }}
        run: |
          set -euo pipefail
          if [[ "$RATES_OUTCOME" == "success" && -f fx-data/rates/latest.json ]]; then
            mkdir -p dist/rates
            cp -R fx-data/rates/. dist/rates/
          else
            echo "::warning::No fx-data branch yet; deploying without rates/. Run the Exchange rates workflow to publish them."
          fi

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: false
          keep_files: false
          full_commit_message: "Deploy ${{ github.sha }}"
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
