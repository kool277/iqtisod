name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    name: Publish GitHub release
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download dist artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Package release assets
        id: package
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [[ "$VERSION" != "$PKG_VERSION" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${PKG_VERSION}. Bump package.json or re-tag as v${PKG_VERSION}."
            exit 1
          fi

          ZIP="jaybi-${VERSION}.zip"
          (cd dist && zip -r -X "../${ZIP}" .)

          sha256sum "$ZIP" > SHA256SUMS
          (cd dist && find . -type f -print0 | sort -z | xargs -0 sha256sum) \
            | sed 's#  \./#  dist/#' >> SHA256SUMS

          if [[ ! -f CHANGELOG.md ]]; then
            echo "::error::CHANGELOG.md not found; cannot extract release notes."
            exit 1
          fi
          awk -v ver="$VERSION" '
            index($0, "## [" ver "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::No release notes for ${VERSION} in CHANGELOG.md (expected a '## [${VERSION}]' section)."
            exit 1
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: jaybi-*.zip

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          set -euo pipefail
          extra_args=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            extra_args+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" "jaybi-${VERSION}.zip" SHA256SUMS \
            --title "Jaybi ${VERSION}" \
            --notes-file notes.md \
            --verify-tag \
            "${extra_args[@]}"
